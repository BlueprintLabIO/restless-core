preserve ordinary Git checkpoints. Do not publish, spend, install paid software, enrol in Steam,
contact people externally, use third-party assets, or claim an unrun capability works.

The source packet is copied into /company/swift-arrival/docs/ before production. Treat the concept and
development plan as product direction, the multiplayer architecture as a proposed ENet-first
host-authoritative design to validate, and the idea vault as non-committed inspiration. The exact
review target must be runnable, not a plan or a diff. Record commands, evidence and known limits under
/company/swift-arrival/evidence/ without private chain-of-thought.
"""
