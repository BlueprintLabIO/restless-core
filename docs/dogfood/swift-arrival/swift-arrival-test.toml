# Swift Arrival — Dogfood 4: networked delivery walking skeleton

Build the private, original two-player Swift Arrival walking skeleton described in
docs/dogfood/swift-arrival/dogfood-4.md. The required result is a reproducible local host and joining
client completing one short delivery in a shared walk-through truck: both players move through the
cab and cargo area; visible world-space hands support host-resolved crate pickup, carrying and release;
