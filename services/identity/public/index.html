<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restless account</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <a class="wordmark" href="/" aria-label="Restless account">restless</a
        ><button id="sign-out" class="quiet" hidden>Sign out of account</button>
      </header>
      <section id="invitation" class="notice" hidden>
        <p>
          You’ve been invited to
          <strong class="company-name">a Restless company</strong>.
        </p>
        <p id="invitation-instruction">
          Sign in with the email address that received the invitation.
        </p>
        <button id="accept-invitation" hidden>Accept invitation</button>
      </section>
      <p id="error" role="alert" hidden></p>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <section id="authentication" class="pane">
        <h1 id="form-heading">Sign in</h1>
        <form id="account-form">
          <label id="name-field" hidden
            >Name<input
              id="name"
              name="name"
              autocomplete="name"
              maxlength="120"
          /></label>
          <label
            >Email<input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
          /></label>
          <label id="password-field"
            >Password<input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button id="submit-account" type="submit">Sign in</button>
        </form>
        <div class="form-links">
          <button id="switch-mode" class="quiet">Create an account</button
          ><button id="forgot-password" class="quiet">Forgot password?</button>
        </div>
        <button id="resend-verification" class="quiet" hidden>
          Resend verification email
        </button>
      </section>
      <section id="company" hidden>
        <div class="company-heading">
          <h1 class="company-name">Your company</h1>
          <button id="enter-company" hidden>
            Open company <span aria-hidden="true">↗</span>
          </button>
        </div>
        <p id="account-identity"></p>
        <button id="bootstrap-company" hidden>Set up company access</button>
        <p id="no-access" hidden>
          You haven’t joined this company yet. Open your invitation email to
          continue.
        </p>
        <p id="suspended" hidden>
          Your access to this company is paused. Ask the company owner to
          reinstate it.
        </p>
      </section>
    </main>
  </body>
</html>
