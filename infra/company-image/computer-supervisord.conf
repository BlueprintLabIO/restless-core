; The company computer in its own container (S104 F2): the desktop, its window manager and panel,
; the company browser, its broker and the desktop's web viewer. The container shares the company
; Runtime's network namespace, so every port and the X display (:1, an abstract socket) are where
; the Runtime and its agents already expect them, and its socket sits on the shared company volume
; so the plane reaches it from the Runtime container with `supervisorctl -c computer.conf`.
[supervisord]
nodaemon=true
logfile=/company/run/computer-supervisord.log
pidfile=/company/run/computer-supervisord.pid
childlogdir=/company/run
umask=0022

[unix_http_server]
file=/company/run/computer.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///company/run/computer.sock

[program:desktop]
command=/usr/bin/Xtigervnc :1 -geometry 1280x800 -depth 24 -SecurityTypes None -localhost yes -rfbport 5901
priority=10
autorestart=true
startsecs=2
stdout_logfile=/company/run/desktop.log
stderr_logfile=/company/run/desktop.log

[program:openbox]
command=/usr/local/bin/wait-for-company-display /usr/bin/openbox-session
environment=DISPLAY=":1",HOME="/company/home"
priority=20
autorestart=true
startretries=20
stdout_logfile=/company/run/openbox.log
stderr_logfile=/company/run/openbox.log

[program:desktop-panel]
command=/usr/local/bin/start-company-desktop-panel
environment=DISPLAY=":1",HOME="/company/home"
priority=25
autorestart=true
startretries=20
startsecs=2
stdout_logfile=/company/run/desktop-panel.log
stderr_logfile=/company/run/desktop-panel.log

[program:chromium]
command=/usr/local/bin/start-company-chromium
environment=DISPLAY=":1",HOME="/company/home"
priority=30
autorestart=true
startretries=20
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/company/run/chromium.log
stderr_logfile=/company/run/chromium.log

[program:browser-broker]
command=/usr/local/bin/node /usr/local/lib/restless/browser-broker.mjs
environment=HOME="/company/home",RESTLESS_SUPERVISOR_CONF="/etc/supervisor/conf.d/computer.conf"
priority=40
autorestart=true
startsecs=1
stdout_logfile=/company/run/browser-broker.log
stderr_logfile=/company/run/browser-broker.log

[program:desktop-web]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
priority=40
autorestart=true
startsecs=1
stdout_logfile=/company/run/desktop-web.log
stderr_logfile=/company/run/desktop-web.log
