[supervisord]
nodaemon=true
logfile=/run/restless/trusted-supervisor/supervisord.log
pidfile=/run/restless/trusted-supervisor/supervisord.pid
childlogdir=/run/restless/trusted-supervisor
umask=0077

# This socket controls privileged Runtime infrastructure. It deliberately lives
# on the ephemeral root-owned /run filesystem, never on the company volume.
[unix_http_server]
file=/run/restless/trusted-supervisor/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/restless/trusted-supervisor/supervisor.sock

# The mutable company service catalogue is supervised by a distinct process
# which the trusted supervisor drops to uid/gid 2000 before launch. Company
# configuration is never parsed by this root supervisor.
[program:company-supervisor]
command=/usr/local/bin/start-company-supervisor
# The immutable launcher performs and verifies the complete uid/gid,
# supplementary-group, capability-bounding and NNP transition. Supervisord
# must not drop only the uid while leaving a privileged bounding set behind.
user=root
environment=HOME="/company/home",USER="company",LOGNAME="company"
priority=10
autostart=true
autorestart=unexpected
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/run/restless/trusted-supervisor/company-supervisor.log
stderr_logfile=/run/restless/trusted-supervisor/company-supervisor.log

# The bridge is the only privileged long-lived Runtime process. It launches
# agent children through its own explicit uid/capability drop boundary.
[program:runtime-bridge]
command=/usr/local/bin/start-runtime-bridge
user=root
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/run/restless/trusted-supervisor/runtime-bridge.log
stderr_logfile=/run/restless/trusted-supervisor/runtime-bridge.log
