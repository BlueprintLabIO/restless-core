[supervisord]
nodaemon=true
logfile=/company/run/supervisord.log
pidfile=/company/run/supervisord.pid
childlogdir=/company/run

[unix_http_server]
file=/company/run/supervisor.sock
chmod=0700
chown=company:company

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///company/run/supervisor.sock

# Company projects may keep ordinary durable services beside their code. The
# imported supervisor owns restart behaviour; Restless does not model another
# workflow or service registry around it.
[include]
files=/company/services/supervisor/*.conf

[program:desktop]
command=/usr/bin/Xtigervnc :1 -geometry 1280x800 -depth 24 -SecurityTypes None -localhost yes -rfbport 5901
user=company
priority=10
autorestart=true
startsecs=2
stdout_logfile=/company/run/desktop.log
stderr_logfile=/company/run/desktop.log

[program:openbox]
command=/usr/local/bin/wait-for-company-display /usr/bin/openbox-session
user=company
environment=DISPLAY=":1",HOME="/company/home"
priority=20
autorestart=true
startretries=20
stdout_logfile=/company/run/openbox.log
stderr_logfile=/company/run/openbox.log

[program:desktop-panel]
command=/usr/local/bin/start-company-desktop-panel
user=company
environment=DISPLAY=":1",HOME="/company/home"
priority=25
autorestart=true
startretries=20
startsecs=2
stdout_logfile=/company/run/desktop-panel.log
stderr_logfile=/company/run/desktop-panel.log

[program:chromium]
command=/usr/local/bin/start-company-chromium
user=company
environment=DISPLAY=":1",HOME="/company/home"
priority=30
autorestart=true
startretries=20
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/company/run/chromium.log
stderr_logfile=/company/run/chromium.log

[program:browser-broker]
command=/usr/bin/node /usr/local/lib/restless/browser-broker.mjs
user=company
environment=HOME="/company/home"
priority=40
autorestart=true
startsecs=1
stdout_logfile=/company/run/browser-broker.log
stderr_logfile=/company/run/browser-broker.log

[program:release-health]
command=/usr/bin/node /usr/local/lib/restless/release-health.mjs
user=company
autostart=true
autorestart=true
startsecs=1
startretries=3
stdout_logfile=/company/run/release-health.log
stderr_logfile=/company/run/release-health.log

[program:desktop-web]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=company
priority=40
autorestart=true
startsecs=1
stdout_logfile=/company/run/desktop-web.log
stderr_logfile=/company/run/desktop-web.log
