# This supervisor is private to the Runtime init. Never include company-owned
# configuration or place its socket/logs in a company-writable directory.
[supervisord]
nodaemon=true
user=root
logfile=/run/restless-control/supervisord.log
pidfile=/run/restless-control/supervisord.pid
childlogdir=/run/restless-control

[unix_http_server]
file=/run/restless-control/supervisor.sock
chmod=0600
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/restless-control/supervisor.sock

[include]
files=/run/restless-supervisor/*.conf

[program:company-services]
command=/usr/bin/supervisord -n -c /etc/supervisor/conf.d/restless.conf
user=company
environment=HOME="/company/home"
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/run/restless-control/company-services.log
stderr_logfile=/run/restless-control/company-services.log
