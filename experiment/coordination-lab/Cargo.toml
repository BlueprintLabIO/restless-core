[package]
name = "coordination-lab-turn"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
