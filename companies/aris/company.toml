name = "aris"
mission = """# Aris

## Purpose

Aris helps Australian tutoring centres give students rigorous, trustworthy preparation for NSW
Selective School tests.

## Customers and value

Aris serves tutoring-centre owners and academic managers who need high-quality practice material
without building an assessment-production capability themselves. It provides credible sample papers,
worked answers and a dependable supply of new material.

## Business model

Centres can assess the quality through a useful free sample. Aris earns revenue through paid centre
licences and ongoing paper supply.

## Strategic intent

Win trust through question quality, curriculum relevance and dependable delivery. Focus first on
proving the tutoring-centre offer before expanding audiences, products or channels.

## Operating model

The owner defines the company's purpose, boundaries and consequential reserved decisions. Exec
chooses and coordinates the work required to fulfil that mandate. Staff performs the machine-doable
work and returns observable outcomes, evidence and prepared owner decisions.

## Operating principles

- Evidence before claims.
- Quality before outreach volume.
- Complete the machine-doable work before involving the owner.
- Treat permissions and external relationships as earned authority.
- Learn from real customer response and revise the offer accordingly.
"""
spend_ceiling_usd = 200.0
