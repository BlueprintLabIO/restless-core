<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" />
		<script>
			/* Resolve the theme before first paint so dark never flashes light.
			 * lib/theme.ts owns the preference after this. */
			(function () {
				try {
					var pref = localStorage.getItem('restless:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (error) {}
			})();
		</script>
		<script>
			/* Start the reads a cold company load always makes while the app's code
			 * downloads. lib/model/boot-fetch.ts hands each to its first reader. */
			(function () {
				var top = {
					account: 1,
					company: 1,
					connections: 1,
					documents: 1,
					gallery: 1,
					'office-demo': 1
				};
				var match = location.pathname.match(/^\/([^/]+)/);
				/* The gallery and office demo render fixtures and never read the owner API. */
				var fixtures = match && (match[1] === 'gallery' || match[1] === 'office-demo');
				/* The owner's reads start early only where this browser last saw the owner: a member
				 * is refused them (lib/model/known-role.ts keeps these keys). */
				var role = null,
					planeOwner = false;
				try {
					planeOwner = localStorage.getItem('restless:plane-owner') === '1';
					if (match) role = localStorage.getItem('restless:role:' + decodeURIComponent(match[1]));
				} catch (error) {}
				var urls = !fixtures && planeOwner ? ['/api/companies'] : [];
				/* A company page paints its last layout while it loads (the .boot script below). */
				window.__restlessCompanyPage = !!(match && !top[match[1]] && match[1] !== 'archived');
				if (match && !top[match[1]]) {
					var base = '/api/companies/' + match[1];
					urls.push(base + '/principal');
					/* Each URL exactly as its reader asks for it (boot-preload.test.ts): a preload
					 * nobody claims is a second download. The bare `/attention` read here from
					 * 16 October carried the whole work graph (4 MB on Reno) beside the Inbox's own
					 * `include_work_graph=false` read, and slowed every read the reveal waits on. */
					if (role === 'owner')
						urls.push(base + '/cockpit', base + '/attention?include_work_graph=false');
					/* A person's conversation: the room list, and the room itself when
					 * this browser has opened it before (RoomConversation remembers it). */
					if (/^\/[^/]+\/people\/?$/.test(location.pathname)) {
						urls.push(base + '/rooms?limit=30');
						try {
							var person = new URLSearchParams(location.search).get('person');
							var room =
								person &&
								localStorage.getItem(
									'restless:' + decodeURIComponent(match[1]) + ':person-room:' + person
								);
							if (room) {
								var path = base + '/rooms/' + encodeURIComponent(room);
								urls.push(
									path + '/messages?limit=50',
									path + '/participants',
									path + '/read-cursor'
								);
							}
						} catch (error) {}
					}
				}
				var reads = {};
				try {
					urls.forEach(function (url) {
						reads[url] = fetch(url, {
							credentials: 'same-origin',
							cache: 'no-store',
							signal: AbortSignal.timeout(15000)
						});
						reads[url].catch(function () {});
					});
				} catch (error) {}
				window.__restlessBoot = reads;
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- One mark everywhere (20 October): the SVG where a browser takes it, a 32px PNG where it
		     does not, and a full-bleed copy for home screens. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
		<style>
			/* This remains visible through the first company read, so hydration never reveals a
			 * blank hidden shell or a sidebar that is about to be replaced. */
			.boot {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: grid;
				place-content: center;
				background: var(--bg-app, #eff1f6);
				color: var(--intent-conversation, #547896);
			}
			html[data-theme='dark'] .boot {
				background: #171d28;
				color: #8cabc5;
			}
			/* The one loading screen: the brand's dot field filling the page, the same one Cloud shows
			 * while it opens a company (lib/ui/glyph/MatrixField.svelte draws it in the app). */
			.boot-field {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				color: var(--accent, #48546c);
				opacity: 0.9;
				mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 85%);
				animation: boot-breathe 4.8s ease-in-out infinite;
			}
			html[data-theme='dark'] .boot-field {
				color: #aab4c8;
			}
			/* The field's dots in plain CSS, on screen from the very first paint: the canvas only
			 * draws once its script has run, and the frames before that showed an empty page
			 * (20 October). The canvas covers this once it has drawn. */
			.boot::before {
				content: '';
				position: absolute;
				inset: 0;
				background-image: radial-gradient(circle, currentColor 1px, transparent 1.25px);
				background-size: 9px 9px;
				opacity: 0.22;
				mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 85%);
			}
			.boot.drawn::before {
				display: none;
			}
			@keyframes boot-breathe {
				0%,
				100% {
					opacity: 0.9;
				}
				50% {
					opacity: 0.63;
				}
			}
			/* SvelteKit's own start script sits in .app-mount from the first byte: counting it as the
			 * app having drawn hid this screen before anything was there, so every cold load showed
			 * an empty page first (20 October). */
			body:has(.app-mount > :not(script)):not(:has(.first-paint-pending)) > .boot {
				display: none;
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-field {
					animation: none;
				}
			}
			/* A company page shows its own layout instead (2 Nov): the surfaces this browser last saw
			 * there (lib/model/shell-snapshot.ts), or the top bar alone, in the app's own colours, so
			 * the reveal fills panes already on screen rather than replacing a dotted page. */
			.boot.shell {
				background: var(--bg-app, #eff1f6);
			}
			html[data-theme='dark'] .boot.shell {
				background: var(--bg-app, #0e1014);
			}
			.boot.shell::before,
			.boot.shell .boot-field {
				display: none;
			}
			.boot-panel {
				position: absolute;
				box-sizing: border-box;
			}
			.boot-panel.fallback {
				top: max(var(--app-gutter, 8px), env(safe-area-inset-top));
				left: max(var(--app-gutter, 8px), env(safe-area-inset-left));
				right: max(var(--app-gutter, 8px), env(safe-area-inset-right));
				height: var(--topbar-h, 46px);
				border-radius: 6px;
				border-bottom: 1px solid var(--border, rgba(76, 88, 117, 0.1));
				background: var(--glass, rgba(250, 251, 253, 0.74));
			}
			html[data-theme='dark'] .boot-panel.fallback {
				border-bottom-color: var(--border, rgba(255, 255, 255, 0.07));
				background: var(--glass, rgba(17, 19, 24, 0.8));
			}
			@media (max-width: 760px) {
				.boot-panel.fallback {
					--app-gutter: 4px;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="boot bridge-tokens" role="status" aria-label="Opening your workspace">
			<canvas class="boot-field" aria-hidden="true"></canvas>
		</div>
		<script>
			/* A company page's loading screen is its layout: the surfaces lib/model/shell-snapshot.ts
			 * recorded at this width and theme (shellFor there is this choice), else the top bar. */
			(function () {
				var boot = document.querySelector('.boot');
				if (!boot || !window.__restlessCompanyPage) return;
				boot.classList.add('shell');
				document.documentElement.classList.add('boot-shell');
				var shell = null;
				try {
					var stored = JSON.parse(localStorage.getItem('restless:shell') || 'null');
					if (stored && stored.v === 1 && stored.sections) {
						var section = location.pathname.split('/')[2] || '';
						var found = stored.sections[section] || stored.sections[stored.last];
						if (
							found &&
							found.w === innerWidth &&
							found.theme === document.documentElement.dataset.theme &&
							Array.isArray(found.panels)
						)
							shell = found;
					}
				} catch (error) {}
				if (!shell) {
					var bar = document.createElement('div');
					bar.className = 'boot-panel fallback';
					boot.appendChild(bar);
					return;
				}
				if (shell.bg) boot.style.background = shell.bg;
				shell.panels.forEach(function (panel) {
					var box = document.createElement('div');
					box.className = 'boot-panel';
					var style = box.style;
					style.top = panel.t + 'px';
					style.left = panel.l + 'px';
					style.right = panel.r + 'px';
					style.bottom = panel.b + 'px';
					style.setProperty('background', panel.bg);
					style.setProperty('border-radius', panel.radius);
					style.setProperty('border-width', panel.bw);
					style.setProperty('border-style', panel.bs);
					style.setProperty('border-color', panel.bc);
					style.setProperty('box-shadow', panel.shadow);
					boot.appendChild(box);
				});
			})();
		</script>
		<script>
			/* Draws the field while the loading screen shows; entering a company shows it again, so
			 * it rests while hidden rather than stopping. Same pattern and clock as MatrixField. */
			(function () {
				var boot = document.querySelector('.boot');
				var canvas = boot && boot.querySelector('canvas');
				var context = canvas && canvas.getContext && canvas.getContext('2d');
				if (!context || boot.classList.contains('shell')) return;
				var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
				var step = 9;
				var drawn = false;
				function draw() {
					if (!canvas.offsetParent && getComputedStyle(boot).display === 'none') {
						drawn = false;
						return setTimeout(draw, 250);
					}
					if (!still || !drawn) {
						var time = Date.now();
						var ratio = Math.min(2, devicePixelRatio || 1);
						var width = canvas.clientWidth;
						var height = canvas.clientHeight;
						if (canvas.width !== Math.round(width * ratio)) {
							canvas.width = Math.round(width * ratio);
							canvas.height = Math.round(height * ratio);
						}
						context.setTransform(ratio, 0, 0, ratio, 0, 0);
						context.clearRect(0, 0, width, height);
						context.fillStyle = getComputedStyle(canvas).color;
						for (var y = 0; y < height; y += step)
							for (var x = 0; x < width; x += step) {
								var v =
									Math.sin(x * 0.021 + time * 0.0006) +
									Math.cos(y * 0.05 - time * 0.0004) +
									Math.sin((x + y) * 0.013);
								var strength = Math.max(0, (v + 0.6) * 0.55);
								if (strength > 0.15) {
									context.globalAlpha = Math.min(0.5, strength * 0.35);
									context.fillRect(x, y, 2, 2);
								}
							}
						drawn = true;
						boot.classList.add('drawn');
					}
					requestAnimationFrame(draw);
				}
				draw();
			})();
		</script>
		<div class="app-mount" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
