<!doctype html>
<html lang="en" style="background: #0a0b0d">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0b0d" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			/* The light sibling, applied pre-paint so nothing flashes.
			 * design-language.md D2: the ramp is authored dark; light inverts it coherently. */
			try {
				const theme = localStorage.getItem('bridge-theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.background = theme === 'light' ? '#f3f4f6' : '#0a0b0d';
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
