<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" />
		<script>
			/* Resolve the theme before first paint so dark never flashes light.
			 * lib/theme.ts owns the preference after this. */
			(function () {
				try {
					var pref = localStorage.getItem('restless:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (error) {}
			})();
		</script>
		<script>
			/* Start the reads a cold company load always makes while the app's code
			 * downloads. lib/model/boot-fetch.ts hands each to its first reader. */
			(function () {
				var top = {
					account: 1,
					company: 1,
					connections: 1,
					documents: 1,
					gallery: 1,
					'office-demo': 1
				};
				var match = location.pathname.match(/^\/([^/]+)/);
				/* The gallery and office demo render fixtures and never read the owner API. */
				var fixtures = match && (match[1] === 'gallery' || match[1] === 'office-demo');
				/* The owner's reads start early only where this browser last saw the owner: a member
				 * is refused them (lib/model/known-role.ts keeps these keys). */
				var role = null,
					planeOwner = false;
				try {
					planeOwner = localStorage.getItem('restless:plane-owner') === '1';
					if (match) role = localStorage.getItem('restless:role:' + decodeURIComponent(match[1]));
				} catch (error) {}
				var urls = !fixtures && planeOwner ? ['/api/companies'] : [];
				if (match && !top[match[1]]) {
					var base = '/api/companies/' + match[1];
					urls.push(base + '/principal');
					if (role === 'owner') urls.push(base + '/cockpit', base + '/attention');
					/* A person's conversation: the room list, and the room itself when
					 * this browser has opened it before (RoomConversation remembers it). */
					if (/^\/[^/]+\/people\/?$/.test(location.pathname)) {
						urls.push(base + '/rooms?limit=30');
						try {
							var person = new URLSearchParams(location.search).get('person');
							var room =
								person &&
								localStorage.getItem(
									'restless:' + decodeURIComponent(match[1]) + ':person-room:' + person
								);
							if (room) {
								var path = base + '/rooms/' + encodeURIComponent(room);
								urls.push(
									path + '/messages?limit=50',
									path + '/participants',
									path + '/read-cursor'
								);
							}
						} catch (error) {}
					}
				}
				var reads = {};
				try {
					urls.forEach(function (url) {
						reads[url] = fetch(url, {
							credentials: 'same-origin',
							cache: 'no-store',
							signal: AbortSignal.timeout(15000)
						});
						reads[url].catch(function () {});
					});
				} catch (error) {}
				window.__restlessBoot = reads;
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
		<style>
			/* This remains visible through the first company read, so hydration never reveals a
			 * blank hidden shell or a sidebar that is about to be replaced. */
			.boot {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: grid;
				place-content: center;
				background: var(--bg-app, #eff1f6);
				color: var(--intent-conversation, #547896);
			}
			html[data-theme='dark'] .boot {
				background: #171d28;
				color: #8cabc5;
			}
			.boot-wave {
				display: flex;
				align-items: center;
				gap: 6px;
				height: 110px;
			}
			.boot-wave i {
				width: 8px;
				height: 90px;
				background: repeating-linear-gradient(to top, currentColor 0 7px, transparent 7px 12px);
				animation: boot-wave 1600ms steps(7, end) infinite;
				animation-delay: calc(var(--i) * -90ms);
			}
			@keyframes boot-wave {
				0%,
				100% {
					height: 18px;
					opacity: 0.35;
				}
				50% {
					height: 90px;
					opacity: 0.9;
				}
			}
			body:has(.app-mount > *):not(:has(.first-paint-pending)) > .boot {
				display: none;
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-wave i {
					animation: none;
					height: 42px;
					opacity: 0.7;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="boot bridge-tokens" role="status" aria-label="Opening your workspace">
			<span class="boot-wave" aria-hidden="true"
				><i style="--i: 0"></i><i style="--i: 1"></i><i style="--i: 2"></i><i style="--i: 3"></i
				><i style="--i: 4"></i><i style="--i: 5"></i><i style="--i: 6"></i><i style="--i: 7"></i
				><i style="--i: 8"></i><i style="--i: 9"></i><i style="--i: 10"></i><i style="--i: 11"></i
				><i style="--i: 12"></i
			></span>
		</div>
		<div class="app-mount" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
