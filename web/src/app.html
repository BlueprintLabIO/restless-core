<!doctype html>
<html lang="en" style="background: #f2f3f5">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f2f3f5" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			/* Light is the default and dark is a switch, so only an explicit choice
			 * is restored — the system preference does not get a vote. Applied
			 * pre-paint so the ground never flashes. */
			try {
				if (localStorage.getItem('theme') === 'dark') {
					document.documentElement.dataset.theme = 'dark';
					document.documentElement.style.background = '#08090b';
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
