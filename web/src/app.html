<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" />
		<script>
			/* Resolve the theme before first paint so dark never flashes light.
			 * lib/theme.ts owns the preference after this. */
			(function () {
				try {
					var pref = localStorage.getItem('restless:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (error) {}
			})();
		</script>
		<script>
			/* Start the reads a cold company load always makes while the app's code
			 * downloads. lib/model/boot-fetch.ts hands each to its first reader. */
			(function () {
				var top = {
					account: 1,
					company: 1,
					connections: 1,
					documents: 1,
					gallery: 1,
					'office-demo': 1
				};
				var urls = ['/api/companies'];
				var match = location.pathname.match(/^\/([^/]+)/);
				if (match && !top[match[1]]) {
					var base = '/api/companies/' + match[1];
					urls.push(base + '/principal', base + '/cockpit', base + '/attention');
				}
				var reads = {};
				try {
					urls.forEach(function (url) {
						reads[url] = fetch(url, { credentials: 'same-origin', cache: 'no-store' });
						reads[url].catch(function () {});
					});
				} catch (error) {}
				window.__restlessBoot = reads;
			})();
		</script>
		<meta name="application-name" content="Restless" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
