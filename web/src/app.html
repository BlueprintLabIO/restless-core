<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" />
		<script>
			/* Resolve the theme before first paint so dark never flashes light.
			 * lib/theme.ts owns the preference after this. */
			(function () {
				try {
					var pref = localStorage.getItem('restless:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (error) {}
			})();
		</script>
		<script>
			/* Start the reads a cold company load always makes while the app's code
			 * downloads. lib/model/boot-fetch.ts hands each to its first reader. */
			(function () {
				var top = {
					account: 1,
					company: 1,
					connections: 1,
					documents: 1,
					gallery: 1,
					'office-demo': 1
				};
				var match = location.pathname.match(/^\/([^/]+)/);
				/* The gallery and office demo render fixtures and never read the owner API. */
				var fixtures = match && (match[1] === 'gallery' || match[1] === 'office-demo');
				/* The owner's reads start early only where this browser last saw the owner: a member
				 * is refused them (lib/model/known-role.ts keeps these keys). */
				var role = null,
					planeOwner = false;
				try {
					planeOwner = localStorage.getItem('restless:plane-owner') === '1';
					if (match) role = localStorage.getItem('restless:role:' + decodeURIComponent(match[1]));
				} catch (error) {}
				var urls = !fixtures && planeOwner ? ['/api/companies'] : [];
				if (match && !top[match[1]]) {
					var base = '/api/companies/' + match[1];
					urls.push(base + '/principal');
					if (role === 'owner') urls.push(base + '/cockpit', base + '/attention');
					/* A person's conversation: the room list, and the room itself when
					 * this browser has opened it before (RoomConversation remembers it). */
					if (/^\/[^/]+\/people\/?$/.test(location.pathname)) {
						urls.push(base + '/rooms?limit=30');
						try {
							var person = new URLSearchParams(location.search).get('person');
							var room =
								person &&
								localStorage.getItem(
									'restless:' + decodeURIComponent(match[1]) + ':person-room:' + person
								);
							if (room) {
								var path = base + '/rooms/' + encodeURIComponent(room);
								urls.push(
									path + '/messages?limit=50',
									path + '/participants',
									path + '/read-cursor'
								);
							}
						} catch (error) {}
					}
				}
				var reads = {};
				try {
					urls.forEach(function (url) {
						reads[url] = fetch(url, {
							credentials: 'same-origin',
							cache: 'no-store',
							signal: AbortSignal.timeout(15000)
						});
						reads[url].catch(function () {});
					});
				} catch (error) {}
				window.__restlessBoot = reads;
			})();
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- One mark everywhere (20 October): the SVG where a browser takes it, a 32px PNG where it
		     does not, and a full-bleed copy for home screens. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		%sveltekit.head%
		<style>
			/* This remains visible through the first company read, so hydration never reveals a
			 * blank hidden shell or a sidebar that is about to be replaced. */
			.boot {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: grid;
				place-content: center;
				background: var(--bg-app, #eff1f6);
				color: var(--intent-conversation, #547896);
			}
			html[data-theme='dark'] .boot {
				background: #171d28;
				color: #8cabc5;
			}
			/* The one loading screen: the brand's dot field filling the page, the same one Cloud shows
			 * while it opens a company (lib/ui/glyph/MatrixField.svelte draws it in the app). */
			.boot-field {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				color: var(--accent, #48546c);
				opacity: 0.9;
				mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 85%);
				animation: boot-breathe 4.8s ease-in-out infinite;
			}
			html[data-theme='dark'] .boot-field {
				color: #aab4c8;
			}
			/* The field's dots in plain CSS, on screen from the very first paint: the canvas only
			 * draws once its script has run, and the frames before that showed an empty page
			 * (20 October). The canvas covers this once it has drawn. */
			.boot::before {
				content: '';
				position: absolute;
				inset: 0;
				background-image: radial-gradient(circle, currentColor 1px, transparent 1.25px);
				background-size: 9px 9px;
				opacity: 0.22;
				mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 85%);
			}
			.boot.drawn::before {
				display: none;
			}
			@keyframes boot-breathe {
				0%,
				100% {
					opacity: 0.9;
				}
				50% {
					opacity: 0.63;
				}
			}
			/* SvelteKit's own start script sits in .app-mount from the first byte: counting it as the
			 * app having drawn hid this screen before anything was there, so every cold load showed
			 * an empty page first (20 October). */
			body:has(.app-mount > :not(script)):not(:has(.first-paint-pending)) > .boot {
				display: none;
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-field {
					animation: none;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="boot bridge-tokens" role="status" aria-label="Opening your workspace">
			<canvas class="boot-field" aria-hidden="true"></canvas>
		</div>
		<script>
			/* Draws the field while the loading screen shows; entering a company shows it again, so
			 * it rests while hidden rather than stopping. Same pattern and clock as MatrixField. */
			(function () {
				var boot = document.querySelector('.boot');
				var canvas = boot && boot.querySelector('canvas');
				var context = canvas && canvas.getContext && canvas.getContext('2d');
				if (!context) return;
				var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
				var step = 9;
				var drawn = false;
				function draw() {
					if (!canvas.offsetParent && getComputedStyle(boot).display === 'none') {
						drawn = false;
						return setTimeout(draw, 250);
					}
					if (!still || !drawn) {
						var time = Date.now();
						var ratio = Math.min(2, devicePixelRatio || 1);
						var width = canvas.clientWidth;
						var height = canvas.clientHeight;
						if (canvas.width !== Math.round(width * ratio)) {
							canvas.width = Math.round(width * ratio);
							canvas.height = Math.round(height * ratio);
						}
						context.setTransform(ratio, 0, 0, ratio, 0, 0);
						context.clearRect(0, 0, width, height);
						context.fillStyle = getComputedStyle(canvas).color;
						for (var y = 0; y < height; y += step)
							for (var x = 0; x < width; x += step) {
								var v =
									Math.sin(x * 0.021 + time * 0.0006) +
									Math.cos(y * 0.05 - time * 0.0004) +
									Math.sin((x + y) * 0.013);
								var strength = Math.max(0, (v + 0.6) * 0.55);
								if (strength > 0.15) {
									context.globalAlpha = Math.min(0.5, strength * 0.35);
									context.fillRect(x, y, 2, 2);
								}
							}
						drawn = true;
						boot.classList.add('drawn');
					}
					requestAnimationFrame(draw);
				}
				draw();
			})();
		</script>
		<div class="app-mount" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
