<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" />
		<script>
			/* Resolve the theme before first paint so dark never flashes light.
			 * lib/theme.ts owns the preference after this. */
			(function () {
				try {
					var pref = localStorage.getItem('restless:theme') || 'system';
					var dark =
						pref === 'dark' ||
						(pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (error) {}
			})();
		</script>
		<script>
			/* Start the reads a cold company load always makes while the app's code
			 * downloads. lib/model/boot-fetch.ts hands each to its first reader. */
			(function () {
				var top = {
					account: 1,
					company: 1,
					connections: 1,
					documents: 1,
					gallery: 1,
					'office-demo': 1
				};
				var match = location.pathname.match(/^\/([^/]+)/);
				/* The gallery and office demo render fixtures and never read the owner API. */
				var fixtures = match && (match[1] === 'gallery' || match[1] === 'office-demo');
				/* The owner's reads start early only where this browser last saw the owner: a member
				 * is refused them (lib/model/known-role.ts keeps these keys). */
				var role = null,
					planeOwner = false;
				try {
					planeOwner = localStorage.getItem('restless:plane-owner') === '1';
					if (match) role = localStorage.getItem('restless:role:' + decodeURIComponent(match[1]));
				} catch (error) {}
				var urls = !fixtures && planeOwner ? ['/api/companies'] : [];
				if (match && !top[match[1]]) {
					var base = '/api/companies/' + match[1];
					urls.push(base + '/principal');
					if (role === 'owner') urls.push(base + '/cockpit', base + '/attention');
					/* A person's conversation: the room list, and the room itself when
					 * this browser has opened it before (RoomConversation remembers it). */
					if (/^\/[^/]+\/people\/?$/.test(location.pathname)) {
						urls.push(base + '/rooms?limit=30');
						try {
							var person = new URLSearchParams(location.search).get('person');
							var room =
								person &&
								localStorage.getItem(
									'restless:' + decodeURIComponent(match[1]) + ':person-room:' + person
								);
							if (room) {
								var path = base + '/rooms/' + encodeURIComponent(room);
								urls.push(path + '/messages?limit=50', path + '/participants', path + '/read-cursor');
							}
						} catch (error) {}
					}
				}
				var reads = {};
				try {
					urls.forEach(function (url) {
						reads[url] = fetch(url, { credentials: 'same-origin', cache: 'no-store' });
						reads[url].catch(function () {});
					});
				} catch (error) {}
				window.__restlessBoot = reads;
			})();
		</script>
		<meta name="application-name" content="Restless" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
		<style>
			/* The cockpit's frame paints with the first byte, before its code runs: the app
			 * background, the top bar and the work pane. The app replaces it on mount. */
			.boot {
				position: fixed;
				inset: 0;
				display: grid;
				grid-template-rows: var(--topbar-h, 46px) minmax(0, 1fr);
				gap: 6px;
				padding: var(--app-gutter, 8px);
				background: var(--bg-app, #eff1f6);
				pointer-events: none;
			}
			.boot > i {
				border: 1px solid var(--border, rgba(76, 88, 117, 0.1));
				border-radius: var(--radius-pane, 6px);
				background: var(--surface-pane, #fafbfe);
			}
			body:has(.app-mount > *) > .boot {
				display: none;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="boot bridge-tokens" aria-hidden="true"><i></i><i></i></div>
		<div class="app-mount" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
