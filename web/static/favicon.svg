<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<!-- The Restless mark: the wordmark's pixel R on whole-pixel cells, so it stays sharp at 16px. -->
	<rect width="16" height="16" rx="3.5" fill="#0a0b0d" />
	<g fill="#f4f5f6">
		<rect x="4" y="3" width="6" height="2" rx="0.4" />
		<rect x="4" y="5" width="2" height="8" rx="0.4" />
		<rect x="10" y="5" width="2" height="2" rx="0.4" />
		<rect x="6" y="7" width="4" height="2" rx="0.4" />
		<rect x="8" y="9" width="2" height="2" rx="0.4" />
		<rect x="10" y="11" width="2" height="2" rx="0.4" />
	</g>
</svg>
