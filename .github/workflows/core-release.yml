name: Immutable Core release

on:
  push:
    branches: [cloud-release-contract]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: blueprintlabio

concurrency:
  group: immutable-core-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24.7.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check --prefix web
      - run: npm run build --prefix web
      - run: node --test infra/company-image/runtime-agent.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace
      - run: node scripts/verify-account-plane-compose.mjs
      - run: scripts/restless-release-manifest > /tmp/core-identity.json
      - name: Refuse dirty generated contracts
        run: git diff --exit-code

  build-platforms:
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: account-plane
            image: restless-account-plane
            dockerfile: infra/account-plane/Dockerfile
          - name: company-runtime
            image: restless-company-runtime
            dockerfile: infra/company-image/Dockerfile
        platform:
          - value: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - value: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.service.name == 'account-plane'
        with:
          node-version: 24.7.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build owner cockpit for the account plane
        if: matrix.service.name == 'account-plane'
        run: npm ci --prefix web && npm run build --prefix web
      - name: Read contract versions from their defining source
        run: |
          echo "CORE_VERSION=$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
          echo "API_CONTRACT_VERSION=$(sed -n 's/.*API_CONTRACT_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/release.rs)" >> "$GITHUB_ENV"
          echo "ASSERTION_CONTRACT_VERSION=$(sed -n 's/.*ASSERTION_CONTRACT_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/entry.rs)" >> "$GITHUB_ENV"
          echo "SCHEMA_VERSION=$(sed -n 's/.*SCHEMA_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/release.rs)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native worker architecture
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.value }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.service.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            RESTLESS_SOURCE_REVISION=${{ github.sha }}
            RESTLESS_CORE_VERSION=${{ env.CORE_VERSION }}
            RESTLESS_API_CONTRACT_VERSION=${{ env.API_CONTRACT_VERSION }}
            RESTLESS_ASSERTION_CONTRACT_VERSION=${{ env.ASSERTION_CONTRACT_VERSION }}
            RESTLESS_SCHEMA_VERSION=${{ env.SCHEMA_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=core-${{ matrix.service.name }}-${{ matrix.platform.artifact }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.service.name }}-${{ matrix.platform.artifact }}
          provenance: mode=max
          sbom: true
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: core-digests-${{ matrix.service.name }}-${{ matrix.platform.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    needs: build-platforms
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: account-plane
            image: restless-account-plane
          - service: company-runtime
            image: restless-company-runtime
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: core-digests-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing source tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "${IMAGE}:${GITHUB_SHA} already exists; release tags are append-only" >&2
            exit 1
          fi
      - name: Assemble exact multi-architecture image
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
        run: |
          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f -print | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "expected exactly two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi
          references=()
          for digest_file in "${digest_files[@]}"; do
            references+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done
          docker buildx imagetools create "${references[@]}" --tag "${IMAGE}:${GITHUB_SHA}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" | awk '$1 == "Digest:" { print $2; exit }')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect --raw "${IMAGE}@${digest}" > "${{ matrix.service }}.manifest.json"
          jq -e '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"] and
            ([.manifests[] | select(.platform.os == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) >= 2
          ' "${{ matrix.service }}.manifest.json"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.service }}.spdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Refuse high or critical image vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: ${{ matrix.service }}.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: ${{ matrix.service }}.grype.json
      - name: Preserve vulnerability scan evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-vulnerability-scan-${{ matrix.service }}
          path: ${{ matrix.service }}.grype.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record exact image identity
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
        run: |
          scan_sha256="$(sha256sum "${SERVICE}.grype.json" | awk '{print $1}')"
          jq -n --arg service "$SERVICE" --arg image "$IMAGE" --arg digest "$DIGEST" --arg scan_sha256 "$scan_sha256" \
            '{service:$service,image:$image,digest:$digest,vulnerability_scan_sha256:$scan_sha256}' > "${SERVICE}.json"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image and attach signed SBOM
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
        run: |
          cosign trusted-root create --with-default-services --out "${SERVICE}.trusted-root.json"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "${SERVICE}.spdx.json" "${IMAGE}@${DIGEST}"
          cosign sign-blob --yes --bundle "${SERVICE}.signature.bundle.json" "${SERVICE}.json"
          cosign verify-blob --bundle "${SERVICE}.signature.bundle.json" --trusted-root "${SERVICE}.trusted-root.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${SERVICE}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: core-release-image-${{ matrix.service }}
          path: |
            ${{ matrix.service }}.json
            ${{ matrix.service }}.manifest.json
            ${{ matrix.service }}.spdx.json
            ${{ matrix.service }}.grype.json
            ${{ matrix.service }}.signature.bundle.json
            ${{ matrix.service }}.trusted-root.json
          retention-days: 90

  verify-published:
    needs: publish-images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-plane
          - company-runtime
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: core-release-image-${{ matrix.service }}
          path: release-image
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Verify the portable release evidence
        run: |
          record="release-image/${{ matrix.service }}.json"
          jq -e '
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"] and
            ([.manifests[] | select(.platform.os == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) >= 2
          ' "release-image/${{ matrix.service }}.manifest.json"
          scan_sha256="$(sha256sum "release-image/${{ matrix.service }}.grype.json" | awk '{print $1}')"
          jq -e --arg scan_sha256 "$scan_sha256" '.vulnerability_scan_sha256 == $scan_sha256' "$record"
          cosign verify-blob \
            --bundle "release-image/${{ matrix.service }}.signature.bundle.json" \
            --trusted-root "release-image/${{ matrix.service }}.trusted-root.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$record"

  publish-manifest:
    needs: verify-published
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: core-release-image-*
          path: release-images
          merge-multiple: true
      - uses: oras-project/setup-oras@v2.0.1
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Assemble and verify the exact Core release
        env:
          ACCOUNT_PLANE_RECORD: release-images/account-plane.json
          COMPANY_RUNTIME_RECORD: release-images/company-runtime.json
        run: |
          plane_image="$(jq -r .image "$ACCOUNT_PLANE_RECORD")"
          plane_digest="$(jq -r .digest "$ACCOUNT_PLANE_RECORD")"
          runtime_image="$(jq -r .image "$COMPANY_RUNTIME_RECORD")"
          runtime_digest="$(jq -r .digest "$COMPANY_RUNTIME_RECORD")"
          export RESTLESS_ACCOUNT_PLANE_IMAGE_DIGEST="${plane_image}@${plane_digest}"
          export RESTLESS_COMPANY_IMAGE_DIGEST="${runtime_image}@${runtime_digest}"
          mkdir -p dist
          scripts/restless-release-manifest --with-images > dist/core-release.json
          node scripts/core-release-check.mjs dist/core-release.json > dist/verification.json
          cp infra/account-plane/compose.yml dist/account-plane.compose.yml
          sha256sum dist/core-release.json dist/account-plane.compose.yml > dist/SHA256SUMS
      - name: Publish and sign the release manifest and deployment template
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_REPOSITORY: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/restless-core-release
        run: |
          echo "$GH_TOKEN" | oras login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          oras push "${MANIFEST_REPOSITORY}:${GITHUB_SHA}" \
            --artifact-type application/vnd.restless.core.release.v1+json \
            dist/core-release.json:application/vnd.restless.core.release.v1+json \
            dist/account-plane.compose.yml:application/vnd.docker.compose.project+yaml \
            dist/SHA256SUMS:text/plain
          digest="$(oras manifest fetch --descriptor "${MANIFEST_REPOSITORY}:${GITHUB_SHA}" | jq -r .digest)"
          cosign sign --yes "${MANIFEST_REPOSITORY}@${digest}"
          cosign trusted-root create --with-default-services --out dist/trusted-root.json
          cosign sign-blob --yes --bundle dist/core-release.signature.bundle.json dist/core-release.json
          cosign sign-blob --yes --bundle dist/account-plane.signature.bundle.json dist/account-plane.compose.yml
          cosign verify-blob --bundle dist/core-release.signature.bundle.json --trusted-root dist/trusted-root.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/core-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" dist/core-release.json
          jq -n --arg reference "${MANIFEST_REPOSITORY}@${digest}" '{manifest:$reference}' > dist/published-release.json
      - uses: actions/upload-artifact@v7
        with:
          name: core-release-${{ github.sha }}
          path: dist/
          retention-days: 90
