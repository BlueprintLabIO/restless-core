name: Identity issuer image

# Publishes restless-identity: the self-hosted account service and, at
# /opt/restless/issuer, the @restless/issuer library that Restless Cloud copies
# by digest (ADR 0012). Consumers pin the digest this run prints.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - services/identity/**
      - .github/workflows/identity-image.yml

env:
  IMAGE: ghcr.io/blueprintlabio/restless-identity

concurrency:
  group: identity-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/identity/package-lock.json

      - name: Check the issuer
        run: |
          npm --prefix services/identity ci
          npm --prefix services/identity test
          node --check services/identity/src/issuer.mjs

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/identity
          file: services/identity/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=identity
          cache-to: type=gha,mode=max,scope=identity
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign and record the immutable reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          cosign sign --yes "$reference"
          docker buildx imagetools inspect "$reference" >/dev/null
          echo "restless-identity: \`${reference}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$reference"
