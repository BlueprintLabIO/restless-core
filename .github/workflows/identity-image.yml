name: Identity issuer image

# Publishes restless-identity: the self-hosted account service and, at
# /opt/restless/issuer, the @restless/issuer library that Restless Cloud copies
# by digest (ADR 0012). Consumers pin the digest this run prints.

on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/blueprintlabio/restless-identity

concurrency:
  group: identity-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, restless-core, restless-core-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Keep the runner's checkout small
        run: scripts/release/compact-checkout.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Smoke-check the issuer source
        run: |
          npm --prefix services/identity ci
          node --check services/identity/src/issuer.mjs

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/identity
          file: services/identity/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign and record the immutable reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          reference="${IMAGE}@${DIGEST}"
          cosign sign --yes "$reference"
          docker buildx imagetools inspect "$reference" >/dev/null
          echo "restless-identity: \`${reference}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$reference"
      - name: Reclaim runner disk
        if: always()
        run: test ! -x scripts/release/reclaim-runner.sh || scripts/release/reclaim-runner.sh
