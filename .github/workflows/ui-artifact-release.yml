name: Core product artifacts

on:
  push:
    branches: [dev]
    paths:
      - LICENSE
      - web/**
      - services/identity/library/**
      - services/identity/src/issuer.mjs
      - services/identity/src/membership-sql.mjs
      - services/identity/src/core-request.mjs
      - scripts/release/**
      - .dagger/src/**
      - .dagger/package*.json
      - .dagger/tsconfig.json
      - dagger.json
      - .github/workflows/ui-artifact-release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and seal after package qualification
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: core-product-artifacts
  cancel-in-progress: false

jobs:
  library:
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, x64, restless-core]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kind: [ui, office, issuer]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Dagger
        run: scripts/release/install-dagger.sh
      - name: Check actual library input boundaries
        run: DAGGER_NO_NAG=1 "$HOME/.local/bin/dagger" --progress=plain call verify-library-inputs --source=. stdout
      - name: Qualify and publish the exact package
        env:
          KIND: ${{ matrix.kind }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          epoch="$(git show -s --format=%ct HEAD)"
          out="$RUNNER_TEMP/core-libraries/$KIND"
          dagger_function=library
          auth=()
          if [[ "$PUBLISH" == true ]]; then
            dagger_function=publish-library
            auth=(--username="$GITHUB_ACTOR" --password=env:RESTLESS_REGISTRY_PASSWORD)
          fi
          DAGGER_NO_NAG=1 "$HOME/.local/bin/dagger" --progress=plain call "$dagger_function" --source=. \
            --kind="$KIND" --revision="$GITHUB_SHA" --epoch="$epoch" --scan-period="$(date -u +%F)" \
            "${auth[@]}" export --path="$out"
      - name: Seal and verify with this workflow identity
        if: github.event_name == 'push' || inputs.publish
        env:
          KIND: ${{ matrix.kind }}
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/core-libraries/$KIND"
          DAGGER_NO_NAG=1 "$HOME/.local/bin/dagger" --progress=plain call seal-library --source=. --artifacts="$out" \
            --username="$GITHUB_ACTOR" --password=env:RESTLESS_REGISTRY_PASSWORD \
            --oidc-request-url="$ACTIONS_ID_TOKEN_REQUEST_URL" --oidc-request-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --workflow-ref="$GITHUB_WORKFLOW_REF" export --path="$out"
          printf '### %s\n\n%s\n' "$KIND" "$(jq -er .reference "$out/library-receipt.json")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: core-library-${{ matrix.kind }}-${{ github.sha }}
          path: ${{ runner.temp }}/core-libraries/${{ matrix.kind }}/
          retention-days: 7
      - name: Remove owned job exports
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: rm -rf -- "$RUNNER_TEMP/core-libraries/$KIND"
