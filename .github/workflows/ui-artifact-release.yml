name: Core product artifacts

on:
  push:
    branches: [main]
    paths:
      - LICENSE
      - web/**
      - services/identity/library/**
      - services/identity/src/issuer.mjs
      - services/identity/src/membership-sql.mjs
      - services/identity/src/core-request.mjs
      - scripts/release/**
      - .dagger/src/**
      - .dagger/package*.json
      - .dagger/tsconfig.json
      - dagger.json
      - .github/workflows/ui-artifact-release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish changed inputs and admit existing signed packages
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: core-product-artifacts
  cancel-in-progress: false

jobs:
  libraries:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, restless-core]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Dagger
        run: scripts/release/install-dagger.sh
      - name: Deliver the exact product library set through Dagger
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          out="$RUNNER_TEMP/core-libraries/$GITHUB_SHA"
          DAGGER_NO_NAG=1 "$HOME/.local/bin/dagger" --silent call deliver-libraries --source=. \
            --revision="$GITHUB_SHA" --epoch="$(git show -s --format=%ct HEAD)" --scan-period="$(date -u +%F)" \
            --username="$GITHUB_ACTOR" --password=env:RESTLESS_REGISTRY_PASSWORD \
            --oidc-request-url="$ACTIONS_ID_TOKEN_REQUEST_URL" --oidc-request-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --workflow-ref="$GITHUB_WORKFLOW_REF" --publish="$PUBLISH" --concurrency=2 export --path="$out"
          jq -r '.libraries[] | [.component, (.reference // "qualification only"), (if .reused then "reused" else "qualified" end)] | @tsv' \
            "$out/libraries-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: core-libraries-${{ github.sha }}
          path: ${{ runner.temp }}/core-libraries/${{ github.sha }}/
          retention-days: 7
      - name: Remove owned job export
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/core-libraries/$GITHUB_SHA"
