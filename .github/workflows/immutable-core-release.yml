name: Immutable Core release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable artifacts after qualification
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  NAMESPACE: blueprintlabio
  RELEASE_REPOSITORY: ghcr.io/blueprintlabio/restless-core-release

concurrency:
  group: immutable-core-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  qualify:
    name: Qualify source
    permissions:
      contents: read
    runs-on: [self-hosted, linux, x64, restless-core]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove the checkout is the dispatched source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install the pinned Dagger CLI
        run: scripts/release/install-dagger.sh

      - name: Qualify the exact source through the shared pipeline
        env:
          DAGGER_NO_NAG: "1"
        run: |
          "$HOME/.local/bin/dagger" --progress=plain call qualify --source=.

  publish:
    name: Publish immutable artifacts
    needs: qualify
    if: inputs.publish
    runs-on: [self-hosted, linux, x64, restless-core]
    # Three sequential multi-arch (amd64+arm64, QEMU-emulated) Rust builds
    # run on the owner's machine. No GitHub-hosted runner or Actions cache.
    timeout-minutes: 360
    env:
      # Registry OAuth must use the trusted builder's scoped resolver, rather
      # than the runner host's systemd-resolved stub. Credentials still travel
      # through the standard authenticated BuildKit session; TLS is unchanged.
      BUILDKIT_NO_CLIENT_TOKEN: "true"
    outputs:
      account_plane: ${{ steps.refs.outputs.account_plane }}
      company_runtime: ${{ steps.refs.outputs.company_runtime }}
      native_documents: ${{ steps.refs.outputs.native_documents }}
      release_manifest_digest: ${{ steps.contract.outputs.release_manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove the checkout is the qualified source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the pinned Dagger CLI
        run: scripts/release/install-dagger.sh

      - name: Export the qualified cockpit assets for the account plane
        env:
          DAGGER_NO_NAG: "1"
        run: |
          "$HOME/.local/bin/dagger" --progress=plain call cockpit --source=. export --path=web/build

      - name: Read release values from canonical Core sources
        id: versions
        run: |
          core_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          api_contract="$(sed -n 's/.*API_CONTRACT_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/release.rs)"
          identity_contract="$(sed -n 's/.*ASSERTION_CONTRACT_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/entry.rs)"
          schema_version="$(sed -n 's/.*SCHEMA_VERSION: u32 = \([0-9]*\);.*/\1/p' crates/restlessd/src/release.rs)"
          test -n "$core_version"
          test -n "$api_contract"
          test -n "$identity_contract"
          test -n "$schema_version"
          printf 'core_version=%s\napi_contract=%s\nidentity_contract=%s\nschema_version=%s\n' \
            "$core_version" "$api_contract" "$identity_contract" "$schema_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        id: release_builder
        with:
          # The fixed name reuses the 26 Sep interrupted build's 16.6 GB
          # BuildKit state volume and keeps later releases warm.
          name: builder-22ca3a12-1df4-458c-9464-ef1a9b287638
          keep-state: true
          driver-opts: |
            memory=40g
            memory-swap=40g
            cpu-shares=512
          buildkitd-config: infra/buildkit/release-buildkitd.toml

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the release builder registry resolver
        env:
          RELEASE_BUILDER: ${{ steps.release_builder.outputs.name }}
        run: bash scripts/release/prepare-builder-dns.sh "$RELEASE_BUILDER"

      - uses: sigstore/cosign-installer@v3.10.0

      - name: Find a signed account plane from an interrupted release
        id: prior_account
        run: bash scripts/release/resolve-published-image.sh "${REGISTRY}/${NAMESPACE}/restless-account-plane" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"

      - name: Find a signed company Runtime from an interrupted release
        id: prior_runtime
        run: bash scripts/release/resolve-published-image.sh "${REGISTRY}/${NAMESPACE}/restless-company-runtime" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"

      - name: Find a signed Documents sidecar from an interrupted release
        id: prior_documents
        run: bash scripts/release/resolve-published-image.sh "${REGISTRY}/${NAMESPACE}/restless-native-documents-collaboration" "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" >> "$GITHUB_OUTPUT"

      - name: Build and publish account plane
        id: account
        if: steps.prior_account.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/account-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/blueprintlabio/restless-account-plane:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign the published account plane immediately
        if: steps.prior_account.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.account.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/restless-account-plane@${DIGEST}"

      - name: Build and publish company Runtime
        id: runtime
        if: steps.prior_runtime.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/company-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/blueprintlabio/restless-company-runtime:${{ github.sha }}
          build-args: |
            RESTLESS_CORE_VERSION=${{ steps.versions.outputs.core_version }}
            RESTLESS_SOURCE_REVISION=${{ github.sha }}
            RESTLESS_API_CONTRACT_VERSION=${{ steps.versions.outputs.api_contract }}
            RESTLESS_ASSERTION_CONTRACT_VERSION=${{ steps.versions.outputs.identity_contract }}
            RESTLESS_SCHEMA_VERSION=${{ steps.versions.outputs.schema_version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign the published company Runtime immediately
        if: steps.prior_runtime.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/restless-company-runtime@${DIGEST}"

      - name: Build and publish native Documents sidecar
        id: documents
        if: steps.prior_documents.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/native-documents-collaboration
          file: services/native-documents-collaboration/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/blueprintlabio/restless-native-documents-collaboration:${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Sign the published Documents sidecar immediately
        if: steps.prior_documents.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.documents.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${NAMESPACE}/restless-native-documents-collaboration@${DIGEST}"

      - name: Freeze digest references
        id: refs
        env:
          ACCOUNT_DIGEST: ${{ steps.prior_account.outputs.digest || steps.account.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.prior_runtime.outputs.digest || steps.runtime.outputs.digest }}
          DOCUMENTS_DIGEST: ${{ steps.prior_documents.outputs.digest || steps.documents.outputs.digest }}
        run: |
          for digest in "$ACCOUNT_DIGEST" "$RUNTIME_DIGEST" "$DOCUMENTS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          printf 'account_plane=ghcr.io/blueprintlabio/restless-account-plane@%s\ncompany_runtime=ghcr.io/blueprintlabio/restless-company-runtime@%s\nnative_documents=ghcr.io/blueprintlabio/restless-native-documents-collaboration@%s\n' \
            "$ACCOUNT_DIGEST" "$RUNTIME_DIGEST" "$DOCUMENTS_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Qualify exact multi-architecture image indexes
        env:
          ACCOUNT_PLANE_IMAGE: ${{ steps.refs.outputs.account_plane }}
          COMPANY_RUNTIME_IMAGE: ${{ steps.refs.outputs.company_runtime }}
          NATIVE_DOCUMENTS_IMAGE: ${{ steps.refs.outputs.native_documents }}
        run: |
          for image in "$ACCOUNT_PLANE_IMAGE" "$COMPANY_RUNTIME_IMAGE" "$NATIVE_DOCUMENTS_IMAGE"; do
            docker buildx imagetools inspect --raw "$image" | jq -e '
              ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"] and
              ([.manifests[] | select(.platform.os == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) >= 2
            '
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" >/dev/null
          done

      - name: Assemble released contracts and manifest
        id: contract
        env:
          ACCOUNT_PLANE_IMAGE: ${{ steps.refs.outputs.account_plane }}
          COMPANY_RUNTIME_IMAGE: ${{ steps.refs.outputs.company_runtime }}
          NATIVE_DOCUMENTS_IMAGE: ${{ steps.refs.outputs.native_documents }}
        run: |
          contract_json="$(node scripts/create-company-collaboration-contract-set.mjs \
            --output "$RUNNER_TEMP/core-release" \
            --account-plane-image "$ACCOUNT_PLANE_IMAGE" \
            --company-runtime-image "$COMPANY_RUNTIME_IMAGE" \
            --native-documents-image "$NATIVE_DOCUMENTS_IMAGE")"
          contract_manifest="$(jq -r .manifestPath <<<"$contract_json")"
          release_json="$(node scripts/create-core-release-manifest.mjs \
            --contract-set-manifest "$contract_manifest" \
            --output "$RUNNER_TEMP/core-release")"
          release_manifest="$(jq -r .manifestPath <<<"$release_json")"
          release_digest="$(jq -r .manifestDigest <<<"$release_json")"
          printf 'contract_manifest=%s\nrelease_manifest=%s\nrelease_manifest_digest=%s\n' \
            "$contract_manifest" "$release_manifest" "$release_digest" >> "$GITHUB_OUTPUT"

      - name: Sign the exact release and contract manifests
        env:
          ACCOUNT_PLANE_IMAGE: ${{ steps.refs.outputs.account_plane }}
          COMPANY_RUNTIME_IMAGE: ${{ steps.refs.outputs.company_runtime }}
          NATIVE_DOCUMENTS_IMAGE: ${{ steps.refs.outputs.native_documents }}
          RELEASE_MANIFEST: ${{ steps.contract.outputs.release_manifest }}
          CONTRACT_MANIFEST: ${{ steps.contract.outputs.contract_manifest }}
        run: |
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/release-manifest.sigstore.json" "$RELEASE_MANIFEST"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/contract-set.sigstore.json" "$CONTRACT_MANIFEST"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/release-manifest.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RELEASE_MANIFEST"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/contract-set.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$CONTRACT_MANIFEST"

      - name: Stage the exact signed Core release bundle
        id: bundle
        env:
          ACCOUNT_PLANE_IMAGE: ${{ steps.refs.outputs.account_plane }}
          COMPANY_RUNTIME_IMAGE: ${{ steps.refs.outputs.company_runtime }}
          NATIVE_DOCUMENTS_IMAGE: ${{ steps.refs.outputs.native_documents }}
          RELEASE_MANIFEST_DIGEST: ${{ steps.contract.outputs.release_manifest_digest }}
          RELEASE_MANIFEST: ${{ steps.contract.outputs.release_manifest }}
          CONTRACT_MANIFEST: ${{ steps.contract.outputs.contract_manifest }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-upload"
          cp -R "$RUNNER_TEMP/core-release/." "$RUNNER_TEMP/release-upload/"
          cp "$RUNNER_TEMP/release-manifest.sigstore.json" "$RUNNER_TEMP/release-upload/"
          cp "$RUNNER_TEMP/contract-set.sigstore.json" "$RUNNER_TEMP/release-upload/"
          release_relative="${RELEASE_MANIFEST#"$RUNNER_TEMP/core-release/"}"
          contract_relative="${CONTRACT_MANIFEST#"$RUNNER_TEMP/core-release/"}"
          node scripts/create-core-release-bundle.mjs \
            --bundle-root "$RUNNER_TEMP/release-upload" \
            --release-manifest "$RUNNER_TEMP/release-upload/$release_relative" \
            --contract-set "$RUNNER_TEMP/release-upload/$contract_relative" \
            --release-signature "$RUNNER_TEMP/release-upload/release-manifest.sigstore.json" \
            --contract-signature "$RUNNER_TEMP/release-upload/contract-set.sigstore.json" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --output "$RUNNER_TEMP/release-upload/core-release-bundle.json"
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/release-upload/core-release-bundle.sigstore.json" \
            "$RUNNER_TEMP/release-upload/core-release-bundle.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/release-upload/core-release-bundle.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/release-upload/core-release-bundle.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/core-release-bundle.tar.gz" \
            -C "$RUNNER_TEMP/release-upload" .

      - uses: oras-project/setup-oras@v2.0.1

      - name: Publish and sign the immutable Core bundle
        id: publish_bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch "${RELEASE_REPOSITORY}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "${RELEASE_REPOSITORY}:${GITHUB_SHA} already exists; release artifacts are append-only" >&2
            exit 1
          fi
          # oras rejects an absolute file path as a supply-chain guard against
          # embedding the runner's host path in the pushed artifact's file
          # name; push from RUNNER_TEMP with a relative name instead.
          (cd "$RUNNER_TEMP" && oras push "${RELEASE_REPOSITORY}:${GITHUB_SHA}" \
            --artifact-type application/vnd.restless.core.release-bundle.v1 \
            "core-release-bundle.tar.gz:application/vnd.restless.core.release-bundle.v1+tar+gzip")
          digest="$(oras manifest fetch --descriptor "${RELEASE_REPOSITORY}:${GITHUB_SHA}" | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${RELEASE_REPOSITORY}@${digest}"
          cosign sign --yes "$reference"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$reference"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg bundle "$reference" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg release_manifest_digest "${{ steps.contract.outputs.release_manifest_digest }}" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            '{format:"restless.core.release-handoff.v1",source:{repository:$repository,revision:$revision},workflow:{ref:$workflow_ref},bundle:$bundle,release_manifest_digest:$release_manifest_digest}' \
            > "$RUNNER_TEMP/core-release-handoff.json"
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/core-release-handoff.sigstore.json" \
            "$RUNNER_TEMP/core-release-handoff.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/core-release-handoff.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/core-release-handoff.json"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: restless-core-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-release-handoff.json
            ${{ runner.temp }}/core-release-handoff.sigstore.json
            ${{ runner.temp }}/core-release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Release summary
        env:
          ACCOUNT_PLANE_IMAGE: ${{ steps.refs.outputs.account_plane }}
          COMPANY_RUNTIME_IMAGE: ${{ steps.refs.outputs.company_runtime }}
          NATIVE_DOCUMENTS_IMAGE: ${{ steps.refs.outputs.native_documents }}
          RELEASE_MANIFEST_DIGEST: ${{ steps.contract.outputs.release_manifest_digest }}
          RELEASE_BUNDLE: ${{ steps.publish_bundle.outputs.reference }}
        run: |
          printf '## Immutable Core candidate\n\n- Source: %s\n- Account plane: %s\n- Company Runtime: %s\n- Native Documents: %s\n- Release manifest: %s\n- Core bundle: %s\n' \
            "$GITHUB_SHA" "$ACCOUNT_PLANE_IMAGE" "$COMPANY_RUNTIME_IMAGE" "$NATIVE_DOCUMENTS_IMAGE" \
            "$RELEASE_MANIFEST_DIGEST" "$RELEASE_BUNDLE" >> "$GITHUB_STEP_SUMMARY"
