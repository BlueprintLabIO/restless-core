name: Immutable Core release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and seal immutable artifacts after qualification
        type: boolean
        default: true
      platform:
        description: Qualify one explicit native platform
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64

concurrency:
  group: immutable-core-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

# Three jobs, so "Re-run failed jobs" repeats only the phase that failed: a dropped signing call no
# longer costs the qualify and publish work before it. Publish hands its exact records to seal as a
# short-lived artifact. Each job writes its own phase timings to the run summary.
jobs:
  qualify:
    name: Qualify exact candidate
    runs-on: ${{ fromJSON(inputs.platform == 'linux/arm64' && '["self-hosted","linux","arm64","restless-core"]' || '["self-hosted","linux","x64","restless-core"]') }}
    timeout-minutes: 60
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the dispatched source and publication identity
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Core publication must use the trusted main workflow.' >&2
            exit 1
          fi
      - name: Install the pinned Dagger CLI
        run: scripts/release/install-dagger.sh
      - name: Qualify the exact source through the shared pipeline
        run: |
          result="$("$HOME/.local/bin/dagger" --silent call qualify --source=.)"
          printf '%s\n' "$result"
          node scripts/release/timings-summary.mjs qualify <<<"$result" >> "$GITHUB_STEP_SUMMARY"
      # Connections are what let a company act through its owner's tools. A
      # release that cannot connect, govern and recover them is not qualified.
      - name: Connections smoke on the exact candidate
        # Both caches below are the runner's own, outside the checkout that actions/checkout wipes.
        # A fresh target rebuilt all 358 crates (2m18s); this one rebuilds only workspace crates.
        # One image tag stays warm: with containerd's snapshotter, deleting the last image that
        # holds the tool layers made the next build unpack them again (~2 min, every run).
        env:
          IMAGE: restless-company-image:release-connections
          EVIDENCE: ${{ runner.temp }}/release-connections-smoke-${{ github.run_id }}
          CARGO_INCREMENTAL: "0"
        run: |
          trap 'rm -rf "$EVIDENCE"' EXIT
          # The runner service does not inherit a login PATH; rustup lives here.
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$HOME/.cache/restless-runner/release-connections-target"
          # docs/BUILD_STORAGE.md: clean a persistent target above 30 GiB.
          if [[ -d "$CARGO_TARGET_DIR" ]] && (( $(du -s --block-size=1G "$CARGO_TARGET_DIR" | cut -f1) > 30 )); then
            cargo clean --target-dir "$CARGO_TARGET_DIR"
          fi
          scripts/restless-cargo build -p restlessd -p restless
          npm --prefix infra/host-tools ci --no-audit --no-fund
          previous="$(docker image inspect --format '{{.Id}}' "$IMAGE" 2>/dev/null || true)"
          source scripts/lib/dev-release.sh
          dev_build_company_image "$PWD" "$IMAGE" "$GITHUB_SHA"
          # Remove only the exact image this build replaced; a container still using it keeps it.
          if [[ -n "$previous" && "$previous" != "$(docker image inspect --format '{{.Id}}' "$IMAGE")" ]]; then
            docker image rm "$previous" >/dev/null 2>&1 || true
          fi
          RESTLESSD_BIN="$CARGO_TARGET_DIR/debug/restlessd" RESTLESS_CLI_BIN="$CARGO_TARGET_DIR/debug/restless" \
            RESTLESS_COMPANY_IMAGE="$IMAGE" python3 scripts/connections-smoke --target core --output "$EVIDENCE"

  publish:
    name: Publish exact platform artifacts
    needs: qualify
    if: inputs.publish
    runs-on: ${{ fromJSON(inputs.platform == 'linux/arm64' && '["self-hosted","linux","arm64","restless-core"]' || '["self-hosted","linux","x64","restless-core"]') }}
    timeout-minutes: 75
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the publication identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - name: Install the pinned Dagger CLI
        run: scripts/release/install-dagger.sh
      - name: Prepare job-scoped registry access for Dockerfile base resolution
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/restless-core/docker
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$RESTLESS_REGISTRY_PASSWORD" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Publish and exercise the exact platform artifacts
        timeout-minutes: 60
        env:
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          rm -rf "$RUNNER_TEMP/core-release-artifacts"
          "$HOME/.local/bin/dagger" --silent call publish --source=. --revision="$GITHUB_SHA" \
            --username="$GITHUB_ACTOR" --password=env:RESTLESS_REGISTRY_PASSWORD \
            --platform="$PLATFORM" --scan-period="$(date -u +%F)" \
            export --path="$RUNNER_TEMP/core-release-artifacts"
          node scripts/release/timings-summary.mjs publish "$RUNNER_TEMP/core-release-artifacts/timings" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: core-release-artifacts-${{ github.sha }}-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/core-release-artifacts/
          if-no-files-found: error
          retention-days: 2
      - name: Remove the job's temporary registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/restless-core/docker/config.json"

  seal:
    name: Seal and verify the Core contract
    needs: publish
    if: inputs.publish
    runs-on: ${{ fromJSON(inputs.platform == 'linux/arm64' && '["self-hosted","linux","arm64","restless-core"]' || '["self-hosted","linux","x64","restless-core"]') }}
    timeout-minutes: 30
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the publication identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main
      - name: Install the pinned Dagger CLI
        run: scripts/release/install-dagger.sh
      - uses: actions/download-artifact@v4
        with:
          name: core-release-artifacts-${{ github.sha }}-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/core-release-artifacts
      - name: Seal and verify the existing Core contract with this workflow identity
        timeout-minutes: 20
        env:
          RESTLESS_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          rm -rf "$RUNNER_TEMP/core-release"
          "$HOME/.local/bin/dagger" --silent call seal --source=. --artifacts="$RUNNER_TEMP/core-release-artifacts" \
            --revision="$GITHUB_SHA" --username="$GITHUB_ACTOR" --password=env:RESTLESS_REGISTRY_PASSWORD \
            --platform="$PLATFORM" --oidc-request-url="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --oidc-request-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN --workflow-ref="$GITHUB_WORKFLOW_REF" \
            export --path="$RUNNER_TEMP/core-release"
          node scripts/release/timings-summary.mjs seal "$RUNNER_TEMP/core-release/timings" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: restless-core-release-${{ github.sha }}-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/core-release/
          if-no-files-found: error
          retention-days: 7
      - name: Release summary
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          reference="$(jq -er .bundle "$RUNNER_TEMP/core-release/core-release-handoff.json")"
          printf '### Qualified Core candidate\n\nSource: %s\n\nPlatform: %s\n\nBundle: %s\n' \
            "$GITHUB_SHA" "$PLATFORM" "$reference" >> "$GITHUB_STEP_SUMMARY"
