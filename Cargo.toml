[workspace]
resolver = "2"
members = [
    "crates/restlessd",
    "crates/restless-contracts",
    "crates/restless-engine",
    "crates/restless-owner",
    "crates/restless",
    "crates/restless-model-gateway",
    "crates/restless-orgintel",
    "crates/restless-runtime-bridge-protocol",
    "crates/restless-runtime-bridge",
]

# Restless is a clean-slate autonomous-company control plane.
# Architecture: see ARCHITECTURE.md. Working agreement: see CLAUDE.md.
#
# Only two binary crates exist for now (daemon + CLI). Layer crates
# (kernel / orgintel / runtime) are intentionally NOT pre-scaffolded —
# they are grown from the first sprint slice that needs them, per
# ARCHITECTURE.md §16.1 (observe before modelling).

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Sprint 01 workspace pins.

# Development builds keep backtrace line numbers but not full debug info: it
# was most of the debug binary's size and link time. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
