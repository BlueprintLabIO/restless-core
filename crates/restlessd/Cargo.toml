[package]
name = "restlessd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

description = """
The restless daemon — the stable coordination core (ARCHITECTURE.md §4.4).
Coordinates Authority, OrgIntel, the persistent company Runtime and the local owner API.
"""

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = "0.4"
dotenvy = "0.15"
restless-model-gateway = { path = "../restless-model-gateway" }
restless-orgintel = { path = "../restless-orgintel" }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.12"
base64 = "0.23.1"
futures-util = "0.3"
fs2 = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"
tower-http = { version = "0.6", features = ["fs", "trace"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rustls-pemfile = "2"
