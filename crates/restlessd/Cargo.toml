[package]
name = "restlessd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = """
The restless daemon — the stable coordination core (ARCHITECTURE.md §4.4).
Starts the engine and the owner API; the code lives in restless-engine and restless-owner.
"""

[dependencies]
anyhow = "1"
dotenvy = "0.15"
restless-orgintel = { path = "../restless-orgintel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
restless-contracts = { path = "../restless-contracts" }
restless-engine = { path = "../restless-engine" }
restless-owner = { path = "../restless-owner" }

[build-dependencies]
# Compile speed only: the restless CLI enables this feature on the proc-macro
# side, so requesting it here keeps `-p restlessd` and `-p restlessd -p restless`
# on one dependency graph (see the matching note in restless-engine).
syn = { version = "3", default-features = false, features = ["extra-traits"] }
