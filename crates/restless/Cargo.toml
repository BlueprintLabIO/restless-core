[package]
name = "restless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

description = """
The Restless owner/operator CLI for companies, Work, people, Authority and Runtime lifecycle.
"""

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dotenvy = "0.15"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
restlessd = { path = "../restlessd" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
