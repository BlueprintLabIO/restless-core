[package]
name = "restless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

description = """
The Restless owner/operator CLI for companies, Work, people, Authority and Runtime lifecycle.
"""

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
