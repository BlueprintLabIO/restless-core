# Restless owns the actor contract. This overlay is applied to every Exec and
# Staff ACP harness process; the isolated profile supplies models.yml only.
disabledExtensions:
  - agent-plugins
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - mcp-json
  - omp-plugins
  - opencode
  - vscode
  - windsurf
mcp:
  enableProjectConfig: false
skills:
  enabled: true
  enableSkillCommands: true
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: true
  customDirectories:
    - /opt/restless/skills
    - /company/skills
autolearn:
  enabled: false
# Restless owns provider continuity and durable cooldowns. Surface the first
# provider refusal instead of hiding it behind OMP's default ten same-route
# retries; otherwise a terminal quota can hold an actor forever and the Work
# never reaches its durable blocked state.
retry:
  enabled: false
  modelFallback: false
# Every actor compacts at a fixed size instead of trusting a context window
# that the gateway's discovery does not report: OMP takes the smaller of this
# and the window it believes, so no model overflows on missing metadata, and a
# long tool loop stops resending its whole history on every call.
compaction:
  enabled: true
  midTurnEnabled: true
  thresholdTokens: 64000
  keepRecentTokens: 20000
# A tool result stays in context for every later call. Keep at most ~3k tokens
# of a large result inline (head and tail); the full output is saved as an
# artifact the actor can read when it needs the middle.
#
# Long-lived services run under the company supervisor (`company-tools`
# skill), so OMP's service mode stays off. With it on, a `name` or `timeout`
# argument errors or backgrounds the command without output; in the S100 runs
# models then wrote every output to /tmp and read it back, and 38-42% of all
# calls were that workaround.
launch:
  enabled: false
tools:
  artifactSpillThreshold: 12
  artifactHeadBytes: 4
  artifactTailBytes: 8
  artifactTailLines: 200
