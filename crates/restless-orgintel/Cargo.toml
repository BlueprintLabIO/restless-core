[package]
name = "restless-orgintel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

description = """
OrgIntel core (ARCHITECTURE.md §4.4): recoverable coordination state,
one Postgres schema per company. Not a ledger, not kernel truth.
"""

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "migrate", "macros"], default-features = false }
thiserror = "2"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
