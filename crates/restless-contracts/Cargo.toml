[package]
name = "restless-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = """
Released contracts and provider fixtures shared by Restless Core, its CLI and deployment
companions: appliance profiles, the published-service contract and fixture, skill packages.
"""

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.23.1"
chrono = "0.4"
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
hmac = "0.12"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1"] }
rcgen = "0.13"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "brotli", "blocking", "multipart"], default-features = false }
restless-orgintel = { path = "../restless-orgintel" }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rustls-pemfile = "2"
