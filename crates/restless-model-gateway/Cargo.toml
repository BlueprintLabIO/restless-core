[package]
name = "restless-model-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

description = """
Purpose-token model gateway with per-company dollar spend fuse.
Lifted from the legacy control plane (docs/SALVAGE.md); the dollar dimension
(SpendStore, rate table, ceiling pre-flight) is new in sprint 01 T2.
"""

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
